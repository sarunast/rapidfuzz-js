name: Release

# Cutting a release is one command: push a tag whose name matches
# package.json's version.
#
#   git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN
# secret to store or rotate. It does mean the package must already exist on
# the registry with a trusted publisher configured for this repo and this
# workflow file; npm cannot grant one to a name that has never been
# published. Publish the very first version by hand, then set it up at
# https://www.npmjs.com/package/rapidfuzz-js/access
on:
  push:
    tags: ['v*']

# Never let two releases publish at once, and never cancel one part-way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release
  id-token: write # mint the OIDC token npm authenticates against

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --generate-notes needs the history and prior tags

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Whether the runner's bundled
      # npm already clears that bar changes with the image, and the failure it
      # produces is an opaque auth error rather than a version complaint.
      - name: Ensure npm is new enough for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be taken back. Check it first.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      - run: pnpm install --frozen-lockfile

      # typecheck, lint, format:check, test, build, check:exports, check:pkg.
      # This is exactly what prepublishOnly runs, so the publish below passes
      # --ignore-scripts rather than paying for the whole suite twice.
      - run: pnpm check

      # No --provenance: publishing over OIDC attaches provenance on its own.
      #
      # Skipping a version already on the registry keeps this step honest in
      # the two cases where it would otherwise fail on something that is not a
      # problem: the first release, whose npm publish has to happen by hand
      # because a trusted publisher cannot be granted to a name that does not
      # exist yet, and a re-run after a later step failed.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "rapidfuzz-js@$version" version > /dev/null 2>&1; then
            echo "::notice::rapidfuzz-js@$version is already on npm — skipping publish"
          else
            npm publish --access public --ignore-scripts
          fi

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
