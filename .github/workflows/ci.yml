name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release calls this before it publishes, so a red CI is a release that does
  # not happen. Called on the tagged commit, not on main.
  workflow_call:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole gate, in one job: typecheck, lint, format:check, test, build,
  # check:exports, check:pkg, coverage, and finally the tests again on the
  # oldest Node the package claims to support.
  #
  # The build is the only part that cares which Node it runs on — tsdown loads
  # tsdown.config.ts through Node's native TypeScript stripping, so building
  # needs 22+ even though the library does not — which is why the gate runs on
  # one version and only the tests are repeated on the other.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `pnpm check` chains all of this in one command for a laptop and for
      # prepublishOnly. CI runs the same work as separate steps instead, in a
      # different order: each one gets its own line, its own timing and its own
      # red cross in the UI, and the ordering below puts the answers worth
      # waiting for first.
      #
      # Ordered by what a failure tells you, not by what runs fastest. Types and
      # tests are the two that mean the code is wrong; lint and formatting mean
      # it is untidy; the packaging checks mean it would ship wrong. A formatting
      # failure ahead of the tests would be a red run that says nothing about
      # whether the change works.
      #
      # Keep this list in step with the `check` script. Nothing enforces that —
      # a new check:* script added there and not here would simply never run on
      # CI.
      - name: Typecheck the library
        run: pnpm typecheck:library

      # Stands in for `pnpm test`: same tests, instrumented, plus the 100% gate
      # as `--coverage.thresholds.100` inside the script — so a laptop fails the
      # way CI does. Running both would run the suite twice for one signal.
      # Codecov itself is not the gate: advisory, late, and tokenless on a fork.
      - name: Test coverage (fails below 100%)
        run: pnpm coverage

      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Per-test timings and outcomes, from the JUnit file the coverage script
      # writes. Codecov reads them across runs to spot tests that fail and pass
      # on the same commit, which a single red run cannot tell from a real
      # break.
      #
      # `!cancelled()` rather than `success()`: the step above fails the job
      # when a test fails, and a failing run is precisely the one worth
      # uploading. The upload never fails the job — a test that broke should be
      # reported by the test step, not by the analytics for it.
      #
      # `codecov-action` with `report_type: test_results` rather than the
      # `codecov/test-results-action` the docs suggest. Both wrap the same CLI,
      # and this repository allows actions by pattern — `codecov/codecov-action@*`
      # and `pnpm/action-setup@*` — so the separate action fails the run before a
      # job starts. Widening the allowlist to admit a second action would be the
      # alternative; using the one already trusted is cheaper.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test-report.junit.xml
          # Without this the CLI also uploads whatever else it finds, and what
          # it finds under `report_type: test_results` is the coverage report.
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck the scripts
        run: pnpm typecheck:tooling

      # The build, and the line everything after it depends on. `typecheck:dev`
      # covers tests, benches and config files, and `bench/tooling` imports the
      # built package — which is why the type checking is split rather than run
      # as one `pnpm typecheck` up front. `check:exports` likewise imports each
      # public subpath by its specifier, resolved through the package's own
      # exports map, and the three checks after it read or pack dist/.
      #
      # The token is for the build itself: tsdown carries the Codecov plugin,
      # which measures the bundle and uploads it. Without a token the plugin
      # turns itself off, which is what a laptop and the release job both get —
      # neither should depend on Codecov being up.
      - name: Build
        run: pnpm build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Typecheck the tests and benches
        run: pnpm typecheck:dev

      - name: Public exports
        run: pnpm check:exports

      - name: Consumer declaration emit
        run: pnpm check:consumer

      - name: Tarball contents
        run: pnpm check:tarball

      - name: Package manifest
        run: pnpm check:pkg

      # package.json declares engines.node >=22, so prove the source tests still
      # pass on the minimum supported runtime. Everything above validated the
      # build and the package exports on 24.
      #
      # Switching Node inside the job rather than running a second one: this is
      # a `pnpm test` against a tree that is already checked out and installed,
      # and a separate job would spend a whole runner re-doing both to reach it.
      # The install is reused as-is — no dependency here builds against a Node
      # ABI, so the modules resolved under 24 are the same ones 22 loads.
      #
      # No `cache: pnpm` on this one. The cache was already restored and saved
      # by the setup above, and asking a second time only races it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests on the oldest supported Node
        run: pnpm test
