name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release calls this on the tagged commit, so a red CI is a release that does
  # not happen.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `pnpm check` runs all of this in one command; CI splits it into steps so
  # each failure gets its own red cross, ordered by what a failure tells you:
  # types and tests mean the code is wrong, lint and formatting mean it is
  # untidy, the packaging checks mean it would ship wrong. Keep the list in step
  # with the `check` script — nothing enforces it.
  #
  # One Node version. A second run on the oldest supported one would prove
  # nothing: `lib: ["ES2022"]` in tsconfig.json keeps a newer stdlib call out of
  # src/ entirely, and Node 22 implements ES2022 in full.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck the library
        run: pnpm typecheck:library

      # Stands in for `pnpm test` — same suite, instrumented, and the 100% gate
      # lives in the script so a laptop fails the way CI does. Codecov itself is
      # advisory: late, and tokenless on a fork.
      - name: Test coverage (fails below 100%)
        run: pnpm coverage

      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Per-test timings, which Codecov reads across runs to spot a test that
      # fails and passes on the same commit.
      #
      # `!cancelled()`, because a failing run is the one worth uploading. Uses
      # `codecov-action` rather than the `test-results-action` the docs suggest:
      # both wrap the same CLI, and this repository allows actions by pattern,
      # so the second one would fail the run before a job starts.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test-report.junit.xml
          # Or the CLI also uploads the coverage report it finds.
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck the scripts
        run: pnpm typecheck:tooling

      # Everything below needs dist/, which is why type checking is split rather
      # than run as one `pnpm typecheck` up front: `bench/tooling` imports the
      # built package.
      #
      # The token is for tsdown's Codecov plugin, which measures the bundle.
      # Untokenized it turns itself off, which is what a laptop gets.
      - name: Build
        run: pnpm build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Typecheck the tests and benches
        run: pnpm typecheck:dev

      - name: Public exports
        run: pnpm check:exports

      - name: Consumer declaration emit
        run: pnpm check:consumer

      - name: Tarball contents
        run: pnpm check:tarball

      - name: Package manifest
        run: pnpm check:pkg
