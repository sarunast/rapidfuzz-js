name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole gate: typecheck, lint, format:check, test, build, check:exports,
  # check:pkg. Runs on one Node because the build is the only part that cares
  # which — tsdown loads tsdown.config.ts through Node's native TypeScript
  # stripping, so building needs Node 22+ even though the library does not.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # package.json declares engines.node >=20, so prove the floor still runs the
  # library. Tests only: the build toolchain's own Node requirement is not the
  # published package's, and conflating the two would force engines up to 22
  # for a reason no consumer ever encounters. Node 24 is covered by `check`.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
