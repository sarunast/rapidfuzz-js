name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole gate: typecheck, lint, format:check, test, build, check:exports,
  # check:pkg. Runs on one Node because the build is the only part that cares
  # which — tsdown loads tsdown.config.ts through Node's native TypeScript
  # stripping, so building needs Node 22+ even though the library does not.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # package.json declares engines.node >=22, so prove the floor still runs the
  # library. Tests only, because the build toolchain's Node requirement is not
  # the published package's: tsdown loads its config through native TypeScript
  # stripping and so needs 22+, which says nothing about what a consumer needs.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
