name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release calls this before it publishes, so a red CI is a release that does
  # not happen. Called on the tagged commit, not on main.
  workflow_call:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole gate: typecheck, lint, format:check, test, build, check:exports,
  # check:pkg. Runs on one Node because the build is the only part that cares
  # which — tsdown loads tsdown.config.ts through Node's native TypeScript
  # stripping, so building needs Node 22+ even though the library does not.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # `pnpm check` already ran the tests; this re-runs them instrumented, for
      # the lcov.info and the JUnit results the uploads below want. The 100% gate is
      # `--coverage.thresholds.100` inside the script, so a laptop fails the way
      # CI does. Codecov is not the gate — advisory, late, and tokenless on a
      # fork.
      - name: Test coverage (fails below 100%)
        run: pnpm coverage

      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Per-test timings and outcomes, from the JUnit file the coverage script
      # writes. Codecov reads them across runs to spot tests that fail and pass
      # on the same commit, which a single red run cannot tell from a real
      # break.
      #
      # `!cancelled()` rather than `success()`: the step above fails the job
      # when a test fails, and a failing run is precisely the one worth
      # uploading. The upload never fails the job — a test that broke should be
      # reported by the test step, not by the analytics for it.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./test-report.junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Sizes of the published files, so a pull request that grows one says so.
      # `pnpm check` above already built dist/.
      #
      # This measures what npm serves, not what a consumer ships: tsdown builds
      # with `unbundle: true`, so dist/ is one file per source module and a
      # bundler tree-shakes across those boundaries afterwards.
      #
      # Skipped without a token, which is the case on a pull request from a
      # fork — the CLI has nowhere to upload and would fail the job over a
      # measurement. The check is in the script rather than an `if:` because a
      # step's own `env` is not in scope for its own condition.
      - name: Bundle sizes
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::notice::no CODECOV_TOKEN — skipping bundle analysis"
            exit 0
          fi
          pnpm exec bundle-analyzer ./dist \
            --bundle-name=rapidfuzz-js-dist \
            --upload-token="$CODECOV_TOKEN" \
            --ignore-patterns "**/*.map" "**/*.d.ts"

  # package.json declares engines.node >=22, so prove the source tests still
  # pass on the minimum supported runtime. The full check job above validates
  # the build and package exports on Node 24.
  compatibility:
    name: compatibility (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
